[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bajka"
version = "0.1.0"
description = "Interaktywna Bajka Głosowa Zero-UI — prototyp hackathonowy"
requires-python = ">=3.11"
dependencies = [
    "python-vlc>=3.0.21203",
    "azure-cognitiveservices-speech>=1.52",
    "openai>=1.55",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Lokalne AI bez chmury: Foundry Local (Whisper, Phi na NPU/GPU/CPU przez Windows ML) i głos z Windows.
local = [
    "foundry-local-sdk>=2.1",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
]

# Aplikacja mobilna widowni: certyfikat HTTPS dla mikrofonu w telefonach i kod QR na ekran kina.
mobile = ["cryptography>=42", "segno>=1.6"]

[tool.setuptools]
packages = ["bajka"]

[tool.setuptools.package-data]
bajka = ["mobile_app/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
